<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇺🇦</text></svg>">
  <title>Дія</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; }
    #app { max-width: 430px; width: 100%; min-height: 100vh; background: #f0f2f5; position: relative; padding-bottom: 80px; }

    .header { background: #1a3d7c; color: white; padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header .header-right { display: flex; align-items: center; gap: 16px; font-size: 14px; opacity: 0.8; }
    .header .settings-btn { cursor: pointer; padding: 4px 8px; }

    .user-card { background: linear-gradient(135deg, #1a3d7c, #2a5fa8); margin: -10px 16px 16px; padding: 20px; border-radius: 16px; color: white; position: relative; }
    .user-card .name { font-size: 20px; font-weight: 700; }
    .user-card .inn { font-size: 14px; opacity: 0.8; margin-top: 4px; }
    .user-card .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 8px; }

    .profile-selector { background: white; padding: 12px 16px; border-bottom: 1px solid #eef1f5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .profile-chip { background: #f0f4fe; border: none; padding: 6px 16px; border-radius: 20px; font-size: 13px; color: #1a3d7c; cursor: pointer; border: 1px solid transparent; }
    .profile-chip.active { background: #1a3d7c; color: white; border-color: #1a3d7c; }
    .profile-chip.add { background: #e8f5e9; color: #2e7d32; border-color: #2e7d32; }

    .tabs { display: flex; background: white; border-bottom: 1px solid #e5e8ec; padding: 0 8px; position: sticky; top: 72px; z-index: 10; }
    .tab { flex: 1; text-align: center; padding: 12px 0 8px; font-size: 11px; color: #6c7a8a; border-bottom: 3px solid transparent; cursor: pointer; transition: 0.2s; }
    .tab.active { color: #1a3d7c; border-bottom-color: #1a3d7c; font-weight: 600; }
    .tab .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }

    .content { padding: 16px; display: none; }
    .content.active { display: block; }

    /* ===== ОРИГІНАЛЬНІ КАРТКИ ДОКУМЕНТІВ ===== */
    .doc-card { background: linear-gradient(135deg, #1a3d7c, #2a5fa8); border-radius: 16px; padding: 20px; margin-bottom: 16px; color: white; position: relative; overflow: hidden; min-height: 180px; box-shadow: 0 4px 12px rgba(26,61,124,0.3); }
    .doc-card .doc-type { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .doc-card .doc-title { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
    .doc-card .doc-sub { font-size: 13px; opacity: 0.8; margin-bottom: 12px; }
    .doc-card .doc-number { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
    .doc-card .doc-label { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; }
    .doc-card .doc-row { display: flex; justify-content: space-between; margin-top: 8px; }
    .doc-card .doc-row .item { flex: 1; }
    .doc-card .doc-row .item .label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
    .doc-card .doc-row .item .value { font-size: 15px; font-weight: 600; }
    .doc-card .doc-status { position: absolute; bottom: 16px; right: 16px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(4px); }
    .doc-card .doc-photo { width: 70px; height: 90px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; position: absolute; right: 16px; top: 16px; background: rgba(255,255,255,0.1); }
    .doc-card .doc-date { font-size: 10px; opacity: 0.5; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

    /* РНОКПП — особлива картка */
    .doc-card.inn-card { background: linear-gradient(135deg, #0d2b5c, #1a3d7c); }
    .doc-card.inn-card .big-number { font-size: 36px; font-weight: 700; letter-spacing: 4px; margin: 8px 0; }
    .doc-card.inn-card .inn-label { font-size: 11px; opacity: 0.5; text-transform: uppercase; }

    /* Закордонний */
    .doc-card.foreign-card { background: linear-gradient(135deg, #0a4a3a, #1a6b55); }

    /* Placeholder tabs */
    .placeholder-tab { text-align: center; padding: 60px 20px; color: #6c7a8a; }
    .placeholder-tab .big-icon { font-size: 64px; margin-bottom: 16px; display: block; }
    .placeholder-tab h3 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }

    /* Settings */
    .settings-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 999; padding: 40px 24px; overflow-y: auto; }
    .settings-overlay h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #1a3d7c; }
    .settings-overlay p { color: #6c7a8a; margin-bottom: 16px; }
    .settings-overlay input { width: 100%; padding: 14px; border: 1px solid #dde1e6; border-radius: 12px; font-size: 16px; margin-bottom: 12px; background: #f8fafc; }
    .settings-overlay .photo-upload { margin: 8px 0 16px; }
    .settings-overlay .photo-upload label { font-weight: 600; color: #1a1a1a; display: block; margin-bottom: 4px; font-size: 14px; }
    .settings-overlay .photo-upload input[type="file"] { padding: 8px; background: white; border: 1px dashed #dde1e6; border-radius: 8px; width: 100%; }
    .settings-overlay button { background: #1a3d7c; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; width: 100%; margin-top: 8px; }
    .settings-overlay .btn-secondary { background: #e8f5e9; color: #2e7d32; }
    .settings-overlay .btn-danger { background: #ffebee; color: #c62828; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- Settings -->
  <div id="settingsScreen" class="settings-overlay">
    <h2>🇺🇦 Налаштування</h2>
    <p>Додайте нового користувача</p>
    <input id="userName" placeholder="ПІБ" value="Купрін Іван Дмитрович">
    <input id="userInn" placeholder="РНОКПП" value="3942845950">
    <input id="userBirth" placeholder="Дата народження" value="13.12.2007">
    <input id="userPassport" placeholder="Номер паспорта" value="010332772">
    <input id="userForeign" placeholder="Номер закордонного" value="FA123456">
    <div class="photo-upload">
      <label>📸 Паспортне фото (для паспорта)</label>
      <input type="file" id="photoPassport" accept="image/*">
      <label>📸 Фото РНОКПП</label>
      <input type="file" id="photoInn" accept="image/*">
      <label>📸 Фото закордонного</label>
      <input type="file" id="photoForeign" accept="image/*">
    </div>
    <button onclick="saveUser()">Зберегти</button>
    <button class="btn-secondary" onclick="cancelSettings()">Скасувати</button>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>Дія</h1>
    <div class="header-right">
      <span id="headerUser">Купрін Іван</span>
      <span class="settings-btn" onclick="showSettings()">⚙️</span>
    </div>
  </div>

  <!-- Users -->
  <div class="profile-selector" id="userSelector"></div>

  <!-- User Card -->
  <div class="user-card">
    <div class="name" id="displayName">Купрін Іван Дмитрович</div>
    <div class="inn" id="displayInn">РНОКПП: 3942845950</div>
    <div class="badge">✅ Верифіковано</div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="documents"><span class="tab-icon">📄</span>Документи</div>
    <div class="tab" data-tab="services"><span class="tab-icon">🛠️</span>Послуги</div>
    <div class="tab" data-tab="payments"><span class="tab-icon">💳</span>Платежі</div>
    <div class="tab" data-tab="messages"><span class="tab-icon">💬</span>Повідомлення</div>
  </div>

  <!-- Documents -->
  <div class="content active" id="tab-documents">
    <div id="documentsContainer"></div>
  </div>

  <!-- Fake tabs -->
  <div class="content" id="tab-services">
    <div class="placeholder-tab"><span class="big-icon">🛠️</span><h3>Послуги</h3><p>Скоро будуть доступні</p></div>
  </div>
  <div class="content" id="tab-payments">
    <div class="placeholder-tab"><span class="big-icon">💳</span><h3>Платежі</h3><p>Скоро будуть доступні</p></div>
  </div>
  <div class="content" id="tab-messages">
    <div class="placeholder-tab"><span class="big-icon">💬</span><h3>Повідомлення</h3><p>Немає нових повідомлень</p></div>
  </div>

</div>

<script>
  let users = JSON.parse(localStorage.getItem('diya_users')) || {};
  let currentUser = localStorage.getItem('diya_current') || null;

  function saveUsers() { localStorage.setItem('diya_users', JSON.stringify(users)); }

  function renderUserSelector() {
    const container = document.getElementById('userSelector');
    let html = '';
    const keys = Object.keys(users);
    if (keys.length === 0) { html = '<span style="color:#6c7a8a;font-size:14px;">Немає користувачів. Додайте через ⚙️</span>'; }
    else {
      keys.forEach(key => {
        const active = key === currentUser ? 'active' : '';
        html += `<button class="profile-chip ${active}" onclick="selectUser('${key}')">${users[key].name || key}</button>`;
      });
      html += `<button class="profile-chip add" onclick="showSettings()">+ Додати</button>`;
    }
    container.innerHTML = html;
  }

  function selectUser(key) {
    currentUser = key;
    localStorage.setItem('diya_current', key);
    renderUserSelector();
    renderDocuments();
    updateHeader();
  }

  function updateHeader() {
    if (currentUser && users[currentUser]) {
      const short = users[currentUser].name.split(' ').slice(0,2).join(' ') || currentUser;
      document.getElementById('headerUser').textContent = short;
      document.getElementById('displayName').textContent = users[currentUser].name;
      document.getElementById('displayInn').textContent = 'РНОКПП: ' + (users[currentUser].inn || '—');
    }
  }

  function renderDocuments() {
    const container = document.getElementById('documentsContainer');
    if (!currentUser || !users[currentUser]) {
      container.innerHTML = `<div style="text-align:center;padding:40px 0;color:#6c7a8a;">Оберіть або додайте користувача</div>`;
      return;
    }
    const d = users[currentUser];
    const today = new Date().toLocaleDateString('uk-UA');
    const photoPass = d.photoPassport ? `<img src="${d.photoPassport}" class="doc-photo" alt="Фото">` : '';

    container.innerHTML = `
      <!-- Паспорт -->
      <div class="doc-card">
        ${photoPass}
        <div class="doc-type">ID-картка</div>
        <div class="doc-title">Паспорт громадянина України</div>
        <div class="doc-number">${d.passport || '—'}</div>
        <div class="doc-label">Номер документа</div>
        <div class="doc-row">
          <div class="item"><div class="label">Прізвище</div><div class="value">${d.name.split(' ')[0] || '—'}</div></div>
          <div class="item"><div class="label">Ім'я</div><div class="value">${d.name.split(' ')[1] || '—'}</div></div>
          <div class="item"><div class="label">По батькові</div><div class="value">${d.name.split(' ')[2] || '—'}</div></div>
        </div>
        <div class="doc-row">
          <div class="item"><div class="label">Дата народження</div><div class="value">${d.birth || '—'}</div></div>
          <div class="item"><div class="label">Стать</div><div class="value">Ч</div></div>
        </div>
        <div class="doc-status">✅ Дійсний</div>
        <div class="doc-date">Оновлено ${today}</div>
      </div>

      <!-- РНОКПП -->
      <div class="doc-card inn-card">
        <div class="doc-type">Довідка</div>
        <div class="doc-title">Картка платника податків</div>
        <div class="inn-label">РНОКПП</div>
        <div class="big-number">${d.inn || '—'}</div>
        <div class="doc-row">
          <div class="item"><div class="label">ПІБ</div><div class="value">${d.name || '—'}</div></div>
          <div class="item"><div class="label">Дата народження</div><div class="value">${d.birth || '—'}</div></div>
        </div>
        <div class="doc-status">✅ Дійсний</div>
        <div class="doc-date">Оновлено ${today}</div>
      </div>

      <!-- Закордонний -->
      <div class="doc-card foreign-card">
        <div class="doc-type">е-Документ</div>
        <div class="doc-title">Закордонний паспорт</div>
        <div class="doc-number">${d.foreign || '—'}</div>
        <div class="doc-label">Номер документа</div>
        <div class="doc-row">
          <div class="item"><div class="label">ПІБ</div><div class="value">${d.name || '—'}</div></div>
          <div class="item"><div class="label">Дата народження</div><div class="value">${d.birth || '—'}</div></div>
        </div>
        <div class="doc-status">✅ Дійсний</div>
        <div class="doc-date">Оновлено ${today}</div>
      </div>
    `;
  }

  function saveUser() {
    const name = document.getElementById('userName').value.trim() || 'Користувач';
    const inn = document.getElementById('userInn').value.trim() || '—';
    const birth = document.getElementById('userBirth').value.trim() || '—';
    const passport = document.getElementById('userPassport').value.trim() || '—';
    const foreign = document.getElementById('userForeign').value.trim() || '—';
    const key = name + '_' + inn.slice(-4);
    const getPhoto = (id) => {
      const file = document.getElementById(id).files[0];
      return file ? URL.createObjectURL(file) : '';
    };
    users[key] = { name, inn, birth, passport, foreign, photoPassport: getPhoto('photoPassport'), photoInn: getPhoto('photoInn'), photoForeign: getPhoto('photoForeign') };
    saveUsers();
    currentUser = key;
    localStorage.setItem('diya_current', key);
    document.getElementById('settingsScreen').classList.add('hidden');
    renderUserSelector();
    renderDocuments();
    updateHeader();
  }

  function cancelSettings() { document.getElementById('settingsScreen').classList.add('hidden'); }
  function showSettings() { document.getElementById('settingsScreen').classList.remove('hidden'); }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      const target = this.dataset.tab;
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + target).classList.add('active');
    });
  });

  function init() {
    renderUserSelector();
    const keys = Object.keys(users);
    if (keys.length > 0 && !currentUser) { currentUser = keys[0]; localStorage.setItem('diya_current', currentUser); }
    if (currentUser && users[currentUser]) { updateHeader(); renderDocuments(); }
    else { document.getElementById('displayName').textContent = 'Немає даних'; document.getElementById('displayInn').textContent = 'Додайте користувача через ⚙️'; }
  }
  init();
</script>
</body>
</html>
