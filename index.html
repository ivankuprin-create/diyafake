<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇺🇦</text></svg>">
  <title>Дія</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f5f7fa; display: flex; justify-content: center; }
    #app { max-width: 430px; width: 100%; min-height: 100vh; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
    /* Header */
    .header { background: #1a3d7c; color: white; padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header span { font-size: 14px; opacity: 0.8; }
    /* User card */
    .user-card { background: linear-gradient(135deg, #1a3d7c, #2a5fa8); margin: -10px 16px 16px; padding: 20px; border-radius: 16px; color: white; }
    .user-card .name { font-size: 20px; font-weight: 700; }
    .user-card .inn { font-size: 14px; opacity: 0.8; margin-top: 4px; }
    .user-card .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 8px; }
    /* Documents */
    .section-title { padding: 16px 16px 8px; font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .doc-list { padding: 0 16px 80px; }
    .doc-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 14px; border: 1px solid #eef1f5; }
    .doc-item .icon { font-size: 32px; width: 48px; height: 48px; background: #f0f4fe; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .doc-item .info { flex: 1; }
    .doc-item .info .title { font-weight: 600; color: #1a1a1a; }
    .doc-item .info .sub { font-size: 13px; color: #6c7a8a; }
    .doc-item .status { font-size: 12px; color: #2e7d32; background: #e8f5e9; padding: 2px 10px; border-radius: 12px; }
    /* Bottom tab */
    .tab-bar { position: fixed; bottom: 0; max-width: 430px; width: 100%; background: white; border-top: 1px solid #e5e8ec; display: flex; justify-content: space-around; padding: 8px 0 20px; }
    .tab-item { text-align: center; font-size: 11px; color: #6c7a8a; }
    .tab-item.active { color: #1a3d7c; }
    .tab-item .tab-icon { font-size: 22px; display: block; margin-bottom: 2px; }
    /* Settings overlay */
    .settings-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 999; padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; }
    .settings-overlay h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #1a3d7c; }
    .settings-overlay p { color: #6c7a8a; margin-bottom: 24px; }
    .settings-overlay input { width: 100%; padding: 14px; border: 1px solid #dde1e6; border-radius: 12px; font-size: 16px; margin-bottom: 12px; background: #f8fafc; }
    .settings-overlay button { background: #1a3d7c; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <!-- Settings Screen -->
  <div id="settingsScreen" class="settings-overlay">
    <h2>🇺🇦 Налаштування</h2>
    <p>Введіть ваші дані для генерації документів</p>
    <input id="fullName" placeholder="ПІБ" value="Олександр Коваленко">
    <input id="inn" placeholder="РНОКПП (ІНН)" value="1234567890">
    <input id="address" placeholder="Адреса" value="м. Київ, вул. Хрещатик 1">
    <input id="passport" placeholder="Серія та номер паспорта" value="AA 123456">
    <button onclick="saveSettings()">Зберегти →</button>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden">
    <div class="header">
      <h1>Дія</h1>
      <span>Документи</span>
    </div>
    <div class="user-card">
      <div class="name" id="displayName">Олександр Коваленко</div>
      <div class="inn" id="displayInn">РНОКПП: 1234567890</div>
      <div class="badge">✅ Верифіковано</div>
    </div>
    <div class="section-title">Мої документи</div>
    <div class="doc-list">
      <div class="doc-item">
        <div class="icon">🪪</div>
        <div class="info"><div class="title">Паспорт громадянина</div><div class="sub" id="docPassport">AA 123456</div></div>
        <div class="status">Дійсний</div>
      </div>
      <div class="doc-item">
        <div class="icon">📇</div>
        <div class="info"><div class="title">РНОКПП</div><div class="sub" id="docInn">1234567890</div></div>
        <div class="status">Дійсний</div>
      </div>
      <div class="doc-item">
        <div class="icon">🏠</div>
        <div class="info"><div class="title">Місце реєстрації</div><div class="sub" id="docAddress">м. Київ, вул. Хрещатик 1</div></div>
        <div class="status">Дійсний</div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar">
    <div class="tab-item active"><span class="tab-icon">📄</span>Документи</div>
    <div class="tab-item"><span class="tab-icon">🛠️</span>Послуги</div>
    <div class="tab-item"><span class="tab-icon">💬</span>Повідомлення</div>
  </div>
</div>

<script>
  // Load saved data
  function loadData() {
    const saved = localStorage.getItem('diya_user');
    if (saved) {
      const data = JSON.parse(saved);
      document.getElementById('fullName').value = data.name;
      document.getElementById('inn').value = data.inn;
      document.getElementById('address').value = data.address;
      document.getElementById('passport').value = data.passport;
      applyData(data);
      document.getElementById('settingsScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
    }
  }

  function applyData(data) {
    document.getElementById('displayName').textContent = data.name;
    document.getElementById('displayInn').textContent = 'РНОКПП: ' + data.inn;
    document.getElementById('docPassport').textContent = data.passport;
    document.getElementById('docInn').textContent = data.inn;
    document.getElementById('docAddress').textContent = data.address;
  }

  function saveSettings() {
    const data = {
      name: document.getElementById('fullName').value.trim() || 'Ім\'я не вказано',
      inn: document.getElementById('inn').value.trim() || '0000000000',
      address: document.getElementById('address').value.trim() || 'Адресу не вказано',
      passport: document.getElementById('passport').value.trim() || 'XX 000000'
    };
    localStorage.setItem('diya_user', JSON.stringify(data));
    applyData(data);
    document.getElementById('settingsScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
  }

  // Reset settings on double-tap header (for reconfig)
  let tapCount = 0;
  document.querySelector('.header')?.addEventListener('dblclick', () => {
    localStorage.removeItem('diya_user');
    location.reload();
  });

  loadData();
</script>
</body>
</html>
